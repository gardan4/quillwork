[workspace]
resolver = "3"
members = ["crates/quillwork-core", "crates/quillwork-py", "crates/quillwork-wasm"]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/gardan4/quillwork"
homepage = "https://github.com/gardan4/quillwork"

[workspace.dependencies]
quick-xml = "0.42.0"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
crc32fast = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true

[profile.release-small]
inherits = "release"
opt-level = "z"
