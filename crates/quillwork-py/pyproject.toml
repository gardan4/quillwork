[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "quillwork"
description = "Lossless, AI-friendly editing of Word documents and PowerPoint decks"
requires-python = ">=3.12"
license = "Apache-2.0"
# Explicit: without it maturin lists LICENSE in the sdist's metadata but leaves the file in
# crates/quillwork-py/, and PyPI rejects the upload.
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["docx", "word", "pptx", "powerpoint", "ooxml", "tracked-changes", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup :: XML",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/gardan4/quillwork"
Documentation = "https://github.com/gardan4/quillwork/blob/main/docs/BINDING.md"
Issues = "https://github.com/gardan4/quillwork/issues"
Changelog = "https://github.com/gardan4/quillwork/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4.23", "mypy>=1.13"]

[tool.maturin]
# Mixed layout: Rust builds quillwork/_native.*.so, the pure-Python package around it lives in
# python/quillwork (exceptions, namespace constants, the JSON Document wrapper, type stubs).
python-source = "python"
module-name = "quillwork._native"
bindings = "pyo3"
features = ["pyo3/abi3-py312"]
include = [{ path = "python/quillwork/py.typed", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
