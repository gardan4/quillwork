[project]
name = "quillwork-oracle"
version = "0.1.0"
readme = "README.md"
description = "Independent verification oracles for Quillwork: OOXML validity, LibreOffice render, text views, byte locality, token cost."
requires-python = ">=3.12"
dependencies = [
    "lxml>=5.2",
    "tiktoken>=0.8",
    "pypdfium2>=4.30",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.scripts]
oracle = "quillwork_oracle.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quillwork_oracle"]

[tool.pytest.ini_options]
testpaths = ["tests"]
